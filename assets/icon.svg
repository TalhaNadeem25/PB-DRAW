<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#16a34a"/>

  <!-- Paddle body (angled, white) -->
  <g transform="rotate(-35, 512, 512)">
    <!-- Paddle head -->
    <ellipse cx="460" cy="370" rx="180" ry="210" fill="#ffffff"/>
    <!-- Paddle handle -->
    <rect x="422" y="560" width="76" height="220" rx="20" fill="#ffffff"/>
    <!-- Grip wrap -->
    <rect x="430" y="650" width="60" height="14" rx="5" fill="#d1fae5"/>
    <rect x="430" y="672" width="60" height="14" rx="5" fill="#d1fae5"/>
    <rect x="430" y="694" width="60" height="14" rx="5" fill="#d1fae5"/>
  </g>

  <!-- Pickleball (white circle with holes) -->
  <circle cx="720" cy="260" r="130" fill="#ffffff"/>
  <!-- Ball holes -->
  <circle cx="670" cy="220" r="14" fill="#16a34a"/>
  <circle cx="720" cy="205" r="14" fill="#16a34a"/>
  <circle cx="768" cy="225" r="14" fill="#16a34a"/>
  <circle cx="650" cy="265" r="14" fill="#16a34a"/>
  <circle cx="700" cy="250" r="14" fill="#16a34a"/>
  <circle cx="748" cy="260" r="14" fill="#16a34a"/>
  <circle cx="790" cy="268" r="14" fill="#16a34a"/>
  <circle cx="668" cy="308" r="14" fill="#16a34a"/>
  <circle cx="718" cy="298" r="14" fill="#16a34a"/>
  <circle cx="765" cy="305" r="14" fill="#16a34a"/>
  <circle cx="690" cy="345" r="14" fill="#16a34a"/>
  <circle cx="738" cy="340" r="14" fill="#16a34a"/>
</svg>
