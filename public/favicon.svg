<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pickleball Paddle -->
  <defs>
    <linearGradient id="paddleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Paddle face -->
  <ellipse cx="50" cy="35" rx="30" ry="35" fill="url(#paddleGradient)" stroke="#9a3412" stroke-width="2"/>

  <!-- Paddle holes -->
  <circle cx="50" cy="25" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="40" cy="30" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="60" cy="30" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="45" cy="38" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="55" cy="38" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="50" cy="45" r="3" fill="#ffffff" opacity="0.4"/>

  <!-- Paddle handle -->
  <rect x="44" y="65" width="12" height="25" rx="2" fill="#7c2d12" stroke="#9a3412" stroke-width="1"/>
  <rect x="46" y="67" width="8" height="21" rx="1" fill="#a16207"/>

  <!-- Pickleball -->
  <circle cx="72" cy="75" r="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="66" cy="72" r="1.5" fill="#78350f"/>
  <circle cx="72" cy="70" r="1.5" fill="#78350f"/>
  <circle cx="78" cy="72" r="1.5" fill="#78350f"/>
  <circle cx="69" cy="78" r="1.5" fill="#78350f"/>
  <circle cx="75" cy="78" r="1.5" fill="#78350f"/>
  <circle cx="72" cy="82" r="1.5" fill="#78350f"/>
</svg>
